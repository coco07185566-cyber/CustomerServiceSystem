services:
  customer-service-system:
    image: mlogclub/customer-service-system:latest-lancedb
    restart: unless-stopped
    ports:
      - "8083:8083"
    volumes:
      - ./docker/customer-service-system-sqlite-lancedb.yaml:/app/config/config.yaml:ro
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
